services:
  mysql:
    container_name: mysql
    image: mysql:9.3.0
    ports:
      - '3306:3306'
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=camping
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - mysql

  server:
    build:
      context: ./server
      target: dev
    container_name: server
    image: wapregit/server
    ports:
      - '5000:5000'
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./server:/app:delegated
      - node_modules_server:/app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - DATABASE_URL=mysql://root:1234@mysql:3306/camping
    command: npm run dev
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5000/healthcheck']
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - dev

  server-prod:
    build:
      context: ./server
      target: prod
    container_name: server-prod
    image: wapregit/server
    ports:
      - '5000:5000'
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://root:1234@mysql:3306/camping
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    profiles:
      - prod

  client:
    build:
      context: ./client
      target: dev
    container_name: client
    image: wapregit/client
    ports:
      - '5173:5173'
    depends_on:
      - server
    volumes:
      - ./client:/app:delegated
      - node_modules_client:/app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev -- --host
    profiles:
      - dev

  client-prod:
    build:
      context: ./client
      target: prod
    container_name: client-prod
    image: wapregit/client
    ports:
      - '80:80'
    depends_on:
      - server-prod
    environment:
      - NODE_ENV=production
    profiles:
      - prod

volumes:
  mysql-data:
  node_modules_server:
  node_modules_client:
